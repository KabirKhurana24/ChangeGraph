<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f9fc" />
  <meta name="description" content="ChangeGraph — enterprise requirements, dependency impact and release-readiness workspace." />
  <title>ChangeGraph · Product Delivery Workspace</title>
</head>
<body>
  <div id="auth-root"></div>
  <div id="app" class="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand-lockup">
        <div class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 8.5 16 4l8 4.5v9L16 28l-8-4.5z"/><path d="m8 8.5 8 4.7 8-4.7M16 13.2V28M8 17l8 4.5 8-4.5"/></svg></div>
        <div><div class="brand-name">ChangeGraph</div><div class="brand-caption">PRODUCT DELIVERY OS</div></div>
      </div>
      <div class="workspace-switcher"><div class="workspace-icon">RB</div><div class="workspace-copy"><strong>Retail Banking</strong><span>Enterprise workspace</span></div><span class="chevron">⌄</span></div>
      <div class="side-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-icon" data-icon="grid"></span><span>Overview</span><kbd>⌘ 1</kbd></button>
        <button class="nav-item" data-view="requirements"><span class="nav-icon" data-icon="list"></span><span>Requirements</span><span class="nav-count" id="req-nav-count">10</span></button>
        <button class="nav-item" data-view="dependencies"><span class="nav-icon" data-icon="nodes"></span><span>Dependencies</span><span class="nav-dot"></span></button>
        <button class="nav-item" data-view="backlog"><span class="nav-icon" data-icon="kanban"></span><span>Backlog</span></button>
        <button class="nav-item" data-view="qa"><span class="nav-icon" data-icon="shield"></span><span>QA & traceability</span></button>
        <button class="nav-item" data-view="documentation"><span class="nav-icon" data-icon="file"></span><span>Documentation</span></button>
      </nav>
      <div class="side-label side-label-spaced">DELIVERY</div>
      <div class="release-card"><div class="release-card-top"><span class="release-badge">R</span><span class="release-status">IN PROGRESS</span></div><div class="release-name">Release 2.4.0</div><div class="release-meta">Joint-account onboarding</div><div class="mini-progress"><span style="width:76%"></span></div><div class="release-foot"><span>Readiness</span><strong id="sidebar-readiness">76%</strong></div></div>
      <div class="sidebar-bottom"><button class="nav-item" data-action="help"><span class="nav-icon" data-icon="help"></span><span>Help & shortcuts</span></button>
        <div class="profile-row"><div class="avatar" id="sidebar-user-avatar">PO</div><div class="profile-copy"><strong id="sidebar-user-name">Demo Product Owner</strong><span id="sidebar-user-role">Product owner</span></div><button class="icon-button small" data-action="profile-menu" aria-label="Profile menu">•••</button></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="breadcrumbs"><span>Workspace</span><span class="crumb-sep">/</span><strong id="breadcrumb-current">Overview</strong></div>
        <div class="topbar-right"><span id="environment-chip" class="environment-chip">DEMO ENVIRONMENT</span><div class="release-select"><span class="live-dot"></span><span>Release 2.4.0</span><span class="muted">⌄</span></div><button class="top-icon-button" data-action="command" aria-label="Search"><span data-icon="search"></span><kbd>⌘ K</kbd></button><button class="top-icon-button notification-button" data-action="notifications" aria-label="Notifications"><span data-icon="bell"></span><i></i></button><button class="top-avatar" id="top-user-avatar" data-action="profile-menu">PO</button></div>
      </header>
      <div id="view-root" class="view-root" aria-live="polite"></div>
    </main>
  </div>
  <div id="modal-root"></div><div id="drawer-root"></div><div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
